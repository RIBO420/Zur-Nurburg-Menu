<!doctype html>
<html lang="nl" style="background:#f6f3f1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#25282f">
<title>Zur Nürburg — Menukaart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze:wght@400;500;600&family=Karla:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;
  --stone:#f6f3f1; --stone-2:#ebe6e3; --white:#fffdfc;
  --basalt:#25282f; --basalt-2:#353941;
  --ink:#202228; --ink-2:#67696f; --line:#dcd8d5;
  --ahr:#b42c2c; --ahr-soft:#f7e8e6; --ahr-ink:#8e2323;
  --cream:#f3ece2; --cream-2:#b9ad9d;
  --green:#3f7a4a; --green-soft:#e6f0e6;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--stone)}
body{margin:0;background:var(--stone)!important;color:var(--ink);font:400 16px/1.45 Karla,system-ui,sans-serif;font-feature-settings:"tnum" 1;overscroll-behavior-y:none}
#app{background:var(--stone);color:var(--ink);min-height:100dvh;position:relative}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ahr);outline-offset:2px}
h1,h2,h3{margin:0;font-family:Grenze,serif;font-weight:500;letter-spacing:.005em}
svg{display:block}
[hidden]{display:none!important}

/* ---------- hero ---------- */
.hero{background:var(--basalt);color:var(--cream);padding:calc(var(--sat) + 12px) 20px 26px;position:relative}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .table{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--cream-2)}
.hero .table b{font-weight:600;color:var(--cream)}
.hero .table i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6fae7a;box-shadow:0 0 0 3px rgba(111,174,122,.25)}
.hero .tools{display:flex;gap:6px;align-items:center}
.ic{width:38px;height:38px;border-radius:50%;background:var(--basalt-2);display:grid;place-items:center;color:var(--cream)}
.ic svg{width:19px;height:19px}
.lang{position:relative}
.langbtn{display:flex;align-items:center;gap:6px;height:38px;padding:0 9px 0 10px;border-radius:999px;background:var(--basalt-2);color:var(--cream);font-size:13px;font-weight:600}
.langbtn .chev{width:14px;height:14px;color:var(--cream-2);transition:transform .2s}
.langbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.langbtn .flag svg{transform:none!important}
.flag{display:inline-block;width:20px;height:14px;border-radius:3px;overflow:hidden;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.flag svg{width:100%;height:100%}
.langmenu{position:absolute;right:0;top:calc(100% + 8px);min-width:172px;background:var(--white);color:var(--ink);border-radius:14px;padding:6px;box-shadow:0 14px 34px -8px rgba(0,0,0,.45),0 0 0 1px var(--line);z-index:30;transform-origin:top right;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-4px)}}
.langmenu button{display:flex;align-items:center;gap:11px;width:100%;height:44px;padding:0 12px;border-radius:9px;font-size:15px;font-weight:500;text-align:left}
.langmenu button[aria-selected="true"]{background:var(--stone-2)}
.langmenu button[aria-selected="true"]::after{content:"";margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--ahr)}
.hero .logo{display:block;width:236px;height:auto;margin:34px auto 0}
.hero p{margin:18px auto 0;max-width:30ch;text-align:center;font-size:14.5px;color:var(--cream-2);line-height:1.5}
.infolink{display:block;margin:14px auto 0;font-size:13.5px;color:var(--cream-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(185,173,157,.45)}
.infolink:active{color:var(--cream)}

/* ---------- sticky nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:var(--stone);border-bottom:1px solid var(--line);display:flex;gap:8px;padding:8px 16px;align-items:center}
.catbtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;padding:0 12px 0 14px;border-radius:12px;background:var(--basalt);color:var(--cream);font-weight:600;font-size:15px}
.catbtn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbtn svg{width:16px;height:16px;flex:0 0 auto}
.seg{display:flex;background:var(--stone-2);border-radius:12px;padding:3px;flex:0 0 auto}
.seg button{padding:0 13px;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(35,30,29,.12)}
/* category sheet */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px 12px 12px;min-height:88px;border-radius:14px;background:var(--white);border:1px solid var(--line);text-align:left;font-family:Grenze,serif;font-size:18px;line-height:1.1;transition:transform .12s}
.cgrid button:active{transform:scale(.97)}
.cgrid button i{width:38px;height:38px;border-radius:10px;background:var(--stone-2);display:grid;place-items:center;color:var(--ink)}
.cgrid button i svg{width:22px;height:22px}
.cgrid button span{display:flex;flex-direction:column;gap:1px}
.cgrid button small{font-family:Karla;font-size:12px;color:var(--ink-2)}
.cgrid button[aria-current="true"]{background:var(--basalt);border-color:var(--basalt);color:var(--cream)}
.cgrid button[aria-current="true"] i{background:var(--basalt-2);color:var(--cream)}
.cgrid button[aria-current="true"] small{color:var(--cream-2)}
.cgrid .filt{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;min-height:48px;font-family:Karla;font-size:15px;font-weight:500}
.cgrid .filt[data-state="veggie"],.cgrid .filt[data-state="vegan"]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.sheet h2.grpT{font-family:Karla;font-size:13px;font-weight:600;color:var(--ink-2);margin-top:18px}
.chip{display:none}

/* ---------- menu ---------- */
main{padding:4px 0 128px;background:var(--stone)}
section.cat{padding:22px 20px 6px;scroll-margin-top:66px}
section.cat h2{font-size:32px;line-height:1;margin-bottom:4px}
section.cat h3{font-size:21px;margin:20px 0 2px;color:var(--ahr-ink)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start;position:relative}
.item:last-child{border-bottom:0}
.item .main{text-align:left;min-width:0;display:block;width:100%}
.item .t{font-weight:500;font-size:16.5px;line-height:1.3;display:block}
.item .t .n{color:var(--ink-2);font-weight:400;font-size:13px;margin-right:6px}
.item .d{display:block;color:var(--ink-2);font-size:14px;line-height:1.4;margin-top:2px}
.item .vs{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:13px;color:var(--ink-2)}
.item .vs b{font-weight:500;color:var(--ink)}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item .p{text-align:right;font-weight:500;font-size:16px;white-space:nowrap;padding-top:1px;line-height:1.3}
.item .p small{display:block;color:var(--ink-2);font-weight:400;font-size:12px}
.tags{display:inline-flex;gap:4px;vertical-align:1px;margin-left:6px}
.tag{display:inline-grid;place-items:center;height:17px;min-width:17px;padding:0 4px;border-radius:9px;font-size:10px;font-weight:600;line-height:1;color:var(--green);background:var(--green-soft);font-family:Karla}
.add{width:34px;height:34px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);font-size:22px;line-height:1;transition:transform .12s}
.add:active{transform:scale(.9)}
.add.bump{animation:bump .3s}
.add.has{background:var(--ahr);border-color:var(--ahr);color:#fff;font-size:14px;font-weight:600}
.item.hidden{display:none}
.empty{color:var(--ink-2);font-size:14px;padding:10px 0 4px}
footer.note{padding:34px 20px 0;color:var(--ink-2);font-size:13px;line-height:1.5}
.credit{display:block;margin-top:18px;font-size:11.5px;letter-spacing:.04em;color:#9a9ca2}

/* ---------- bar ---------- */
.bar{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 16px);z-index:30;transform:translateY(150%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.bar.show{transform:none}
.bar button{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--ahr);color:#fff;padding:14px 18px 14px 14px;border-radius:16px;font-weight:500;font-size:16px;box-shadow:0 12px 28px -10px rgba(180,44,44,.55)}
.bar button.status{background:var(--basalt);box-shadow:0 12px 28px -10px rgba(42,36,35,.6)}
.bar .cnt{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.18);font-size:14px;padding:0 7px;margin-right:12px}
.bar .cnt.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.25)}}
.bar .l{display:flex;align-items:center}
.pulse{width:8px;height:8px;border-radius:50%;background:#6fae7a;margin-right:10px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(111,174,122,.25)}}

/* ---------- sheets ---------- */
.veil{position:fixed;inset:0;background:rgba(35,30,29,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--stone);color:var(--ink);border-radius:22px 22px 0 0;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sab)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0;flex:0 0 auto}
.sheet .body{overflow-y:auto;padding:12px 20px 12px;-webkit-overflow-scrolling:touch}
.sheet .foot{padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--stone);flex:0 0 auto}
.sheet h2{font-size:30px;line-height:1.05;padding-right:40px}
.sheet .desc{color:var(--ink-2);font-size:15px;margin:6px 0 0}
.grp{margin-top:18px}
.gl{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--white);margin-bottom:6px;font-size:15px;text-align:left;min-height:48px}
.opt[aria-checked="true"]{border-color:var(--basalt);box-shadow:inset 0 0 0 1px var(--basalt)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);margin-right:12px;flex:0 0 auto;display:grid;place-items:center}
.opt[aria-checked="true"] .dot{border-color:var(--basalt);background:var(--basalt)}
.opt[aria-checked="true"] .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.opt .ol{display:flex;align-items:center;flex:1}
textarea,input[type=text],input[type=search]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;background:var(--white);color:var(--ink);-webkit-appearance:none}
textarea{resize:none;min-height:64px}
.addrow{display:flex;gap:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--white)}
.stepper button{width:46px;height:52px;font-size:22px;color:var(--ink)}
.stepper span{min-width:26px;text-align:center;font-weight:600}
.cta{flex:1;background:var(--basalt);color:var(--cream);border-radius:14px;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:500;font-size:16px}
.cta.ahr{background:var(--ahr);color:#fff}
.x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--stone-2);display:grid;place-items:center;z-index:1}
.x svg{width:15px;height:15px}

/* order */
.line{display:grid;grid-template-columns:auto 1fr auto;gap:0 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.line.simple{grid-template-columns:1fr auto}
.line .q{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--white)}
.line .q button{width:32px;height:32px;font-size:17px;line-height:1}
.line .q span{font-size:14px;font-weight:600;min-width:18px;text-align:center}
.line .lt{font-weight:500}
.line .ls{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.line .lp{font-weight:500;white-space:nowrap}
.tot{display:flex;justify-content:space-between;padding:14px 0 2px;font-size:17px;font-weight:600}
.tot small{color:var(--ink-2);font-weight:400;font-size:13px;display:block}
.tbl{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:12px;background:var(--stone-2);margin-top:14px;font-size:15px}
.tbl b{font-weight:600}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pay .opt{margin:0;flex-direction:column;align-items:flex-start;gap:2px}
.pay .opt small{color:var(--ink-2);font-size:12.5px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.svc button{padding:14px;border-radius:12px;background:var(--white);border:1px solid var(--line);font-weight:500;font-size:15px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:74px}
.svc button small{color:var(--ink-2);font-weight:400;font-size:13px}
.svc button.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.svc button.on small{color:var(--green)}

/* info */
.hours{border:1px solid var(--line);border-radius:12px;background:var(--white);overflow:hidden}
.hrow{display:flex;justify-content:space-between;padding:10px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow.today{background:var(--green-soft);font-weight:600;color:var(--green)}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctas a{display:flex;flex-direction:column;gap:2px;padding:13px 14px;border-radius:12px;background:var(--basalt);color:var(--cream);text-decoration:none;font-weight:600;font-size:15px}
.ctas a small{font-weight:400;font-size:12.5px;color:var(--cream-2)}
.more{display:flex;flex-direction:column;gap:2px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.more:last-child{border-bottom:0}
.more b{font-weight:600}.more span{color:var(--ink-2)}.more a{color:var(--ahr)}
/* status */
.done{text-align:center;padding:22px 4px 4px}
.done h2{font-size:34px;padding:0}
.done p{color:var(--ink-2);margin:6px auto 0;max-width:28ch}
.steps{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0 6px;position:relative}
.steps::before{content:"";position:absolute;left:16.6%;right:16.6%;top:13px;height:2px;background:var(--line)}
.steps::after{content:"";position:absolute;left:16.6%;top:13px;height:2px;background:var(--green);width:calc(66.6% * var(--pg,0));transition:width .6s}
.step{position:relative;text-align:center;font-size:12.5px;color:var(--ink-2)}
.step i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--stone);border:2px solid var(--line);margin:0 auto 6px;color:transparent;transition:.3s}
.step i svg{width:14px;height:14px}
.step.done i{background:var(--green);border-color:var(--green);color:#fff}
.step.cur i{border-color:var(--green);color:var(--green)}
.step.cur{color:var(--ink);font-weight:600}
.num{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:10px;background:var(--stone-2);font-size:13px;color:var(--ink-2)}
.num b{color:var(--ink);font-family:Grenze;font-size:19px;font-weight:500;margin-left:6px}
.hist{margin-top:20px;border-top:1px solid var(--line);padding-top:4px;text-align:left}
.res{padding:4px 0}

.toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-16px);background:var(--basalt);color:var(--cream);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:520px){#app,.sheet{max-width:480px;margin-left:auto;margin-right:auto}.bar{left:50%;right:auto;width:448px;transform:translate(-50%,150%)}.bar.show{transform:translate(-50%,0)}}
</style>
</head>
<body><div id="app">

<header class="hero">
  <div class="top">
    <div class="table"><i></i><span data-i="table"></span>&nbsp;<b id="tblNo">12</b></div>
    <div class="tools">
      <div class="lang">
        <button class="langbtn" id="langBtn" aria-haspopup="listbox" aria-expanded="false"><span class="flag" id="langFlag"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="langmenu" id="langMenu" role="listbox" hidden>
          <button role="option" data-lang="nl"><span class="flag" data-flag="nl"></span>Nederlands</button>
          <button role="option" data-lang="de"><span class="flag" data-flag="de"></span>Deutsch</button>
          <button role="option" data-lang="en"><span class="flag" data-flag="en"></span>English</button>
        </div>
      </div>
      <button class="ic" id="searchBtn" data-al="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="ic" id="bellBtn" data-al="service"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M12 11V8"/><path d="M10 8h4"/><path d="M3 21h18"/></svg></button>

}

  $('#infoBody').innerHTML=`<h2>Zur Nürburg</h2><p class="desc">Café | Restaurant · Burgplatz 2, 53520 Nürburg</p>
  <div class="grp"><div class="gl">${t('hours')}</div><div class="hours">${rows}</div></div>
  <div class="grp"><div class="ctas"><a href="tel:+4926919399060">${t('call')}<small>02691 939 90 60</small></a><a href="https://maps.google.com/?q=Burgplatz+2,+53520+N%C3%BCrburg" target="_blank" rel="noopener">${t('route')}<small>Burgplatz 2</small></a></div></div>
  <div class="grp"><div class="gl">${t('more')}</div>
    <div class="more"><b>${t('terr')}</b><span>${t('terrS')}</span></div>
    <div class="more"><b>${t('party')}</b><span>${t('partyS')}</span></div>
    <div class="more"><b>${t('stay')}</b><span>${t('stayS')}</span></div>
    <div class="more"><b>${t('fb')}</b><span><a href="https://www.facebook.com/zurnuerburg/" target="_blank" rel="noopener">facebook.com/zurnuerburg</a></span></div>
  </div>`;
}
$('#infoBtn').onclick=()=>{renderInfo();show('#sInfo')};
let tk=false;addEventListener('scroll',()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{tk=false;spy()})},{passive:true});

// ---------- sheets ----------
const veil=$('#veil');let open=null;
const show=id=>{if(open&&open!==id)$(open).classList.remove('on');open=id;$(id).classList.add('on');veil.classList.add('on');document.body.style.overflow='hidden'};
const hide=()=>{if(!open)return;$(open).classList.remove('on');veil.classList.remove('on');document.body.style.overflow='';open=null;$('#q').blur()};
veil.onclick=hide;$$('[data-close]').forEach(b=>b.onclick=hide);
$$('.sheet').forEach(sh=>{let y0=null;sh.addEventListener('touchstart',e=>{if(sh.querySelector('.body').scrollTop<=0)y0=e.touches[0].clientY},{passive:true});sh.addEventListener('touchmove',e=>{if(y0!==null&&e.touches[0].clientY-y0>90){y0=null;hide()}},{passive:true})});

// ---------- item ----------
let cur=null,qty=1,vi=0,ch={};
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o){openItem(items[o.dataset.open]);return}
  const a=e.target.closest('[data-add]');if(a){const it=items[a.dataset.add];if(it.v.length===1&&!it.ch[lang])addLine(it,it.v[0],{},'',1);else openItem(it)}
});
function openItem(it){
  cur=it;qty=1;vi=0;ch={};
  const groups=it.ch[lang]||[];groups.forEach(g=>ch[g.n]=g.o[0]);
  let h=`${it.n?`<div class="gl">Nr. ${it.n}</div>`:''}<h2>${it.t[lang]}</h2>${it.d[lang]?`<p class="desc">${it.d[lang]}</p>`:''}`;
  if(it.v.length>1)h+=`<div class="grp"><div class="gl">${t('size')}</div>${it.v.map((v,i)=>`<button class="opt" role="radio" data-v="${i}" aria-checked="${i===0}"><span class="ol"><span class="dot"></span>${v.l}</span><span>${eur(v.p)}</span></button>`).join('')}</div>`;
  groups.forEach(g=>{h+=`<div class="grp"><div class="gl">${g.n}</div>${g.o.map((o,i)=>`<button class="opt" role="radio" data-g="${g.n}" data-o="${o}" aria-checked="${i===0}"><span class="ol"><span class="dot"></span>${o}</span></button>`).join('')}</div>`});
  h+=`<div class="grp"><div class="gl">${t('note')}</div><textarea id="note" placeholder="${t('noteph')}"></textarea></div><p class="desc" style="font-size:13px;margin-top:12px">${t('allerg')}</p>`;
  $('#itemBody').innerHTML=h;$('#itemBody').scrollTop=0;upd();show('#sItem');
}
$('#itemBody').addEventListener('click',e=>{const o=e.target.closest('.opt');if(!o)return;
  if(o.dataset.v!==undefined){vi=+o.dataset.v;$$('#itemBody .opt[data-v]').forEach(x=>x.setAttribute('aria-checked',x===o))}
  else{ch[o.dataset.g]=o.dataset.o;$$(`#itemBody .opt[data-g="${o.dataset.g}"]`).forEach(x=>x.setAttribute('aria-checked',x===o))}
  upd()});
$('#qMinus').onclick=()=>{qty=Math.max(1,qty-1);upd()};$('#qPlus').onclick=()=>{qty=Math.min(20,qty+1);upd()};
function upd(){$('#qVal').textContent=qty;$('#addPrice').textContent=eur(cur.v[vi].p*qty)}
$('#addBtn').onclick=()=>{addLine(cur,cur.v[vi],ch,$('#note').value.trim(),qty);hide()};
function addLine(it,v,choices,note,q){
  const sub=[v.l,...Object.values(choices),note].filter(Boolean).join(' · ');
  const key=it.id+'|'+sub;const ex=cart.find(l=>l.key===key);
  if(ex)ex.q+=q;else cart.push({key,id:it.id,sub,p:v.p,q});persist();
  const btn=document.querySelector(`.add[data-add="${it.id}"]`);if(btn){btn.classList.add('bump');setTimeout(()=>btn.classList.remove('bump'),300)}
  toast(`${q}× ${it.t[lang]} ${t('added')}`);syncCart(true);
}

// ---------- cart / bar ----------
let payNow=false,guest='';
function syncCart(bump){
  const n=cart.reduce((a,l)=>a+l.q,0),tot=cart.reduce((a,l)=>a+l.p*l.q,0);
  const last=orders[orders.length-1];const b=$('#barBtn');
  if(n>0){b.className='';b.innerHTML=`<span class="l"><span class="cnt${bump?' bump':''}">${n}</span>${t('view')}</span><span>${eur(tot)}</span>`}
  else if(last&&last.step<4){b.className='status';b.innerHTML=`<span class="l"><span class="pulse"></span>${t('status')} ${last.no}</span><span>${t('s'+Math.min(last.step,3))}</span>`}
  $('#bar').classList.toggle('show',n>0||!!(last&&last.step<4));
  $('#placeTot').textContent=eur(tot);
  const q={};cart.forEach(l=>q[l.id]=(q[l.id]||0)+l.q);
  $$('.add').forEach(a=>{const c=q[a.dataset.add];a.classList.toggle('has',!!c);a.textContent=c?c+'×':'+'});
}
$('#barBtn').onclick=()=>{renderOrder();show('#sOrder')};
function renderOrder(){
  const tot=cart.reduce((a,l)=>a+l.p*l.q,0);const last=orders[orders.length-1];
  let h=`<h2>${t('order')}</h2>`;
  if(!cart.length&&!last)h+=`<p class="desc">${t('empty')}</p>`;
  if(cart.length){
    h+=cart.map((l,i)=>`<div class="line"><div class="q"><button data-i="${i}" data-d="-1">−</button><span>${l.q}</span><button data-i="${i}" data-d="1">+</button></div><div><div class="lt">${items[l.id].t[lang]}</div>${l.sub?`<div class="ls">${l.sub}</div>`:''}</div><div class="lp">${eur(l.p*l.q)}</div></div>`).join('');
    h+=`<div class="tot"><span>${t('total')}<small>${t('vat')}</small></span><span>${eur(tot)}</span></div>
    <div class="tbl"><span>${t('bring')}</span><b>${t('table')} ${tbl}</b></div>
    <div class="grp"><div class="gl">${t('name')}</div><input type="text" id="guest" value="${guest}" placeholder="${t('nameph')}"></div>
    <div class="grp"><div class="gl">${t('payh')}</div><div class="pay"><button class="opt" role="radio" data-pay="0" aria-checked="${!payNow}">${t('payLater')}<small>${t('payLaterS')}</small></button><button class="opt" role="radio" data-pay="1" aria-checked="${payNow}">${t('payNow')}<small>${t('payNowS')}</small></button></div></div>`;
  }else if(last){h+=statusHTML(last)}
  const hist=cart.length?orders:orders.slice(0,-1);
  if(hist.length)h+=`<div class="hist"><div class="gl" style="margin-top:12px">${t('earlier')}</div>${hist.map(o=>`<div class="line simple"><div><div class="lt">${t('status')} ${o.no} — ${t('s'+Math.min(o.step,3))}</div><div class="ls">${o.lines.map(l=>l.q+'× '+items[l.id].t[lang]).join(', ')}</div></div><div class="lp">${eur(o.tot)}</div></div>`).join('')}</div>`;
  $('#orderBody').innerHTML=h;$('#orderFoot').hidden=!cart.length;
}
function statusHTML(o){
  const st=[1,2,3].map(i=>`<div class="step ${o.step>i?'done':o.step===i?'cur':''}"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></i>${t('s'+i)}</div>`).join('');
  return `<div class="done"><h2>${o.step>=4?t('s4'):o.step===3?t('s3'):t('placed')}</h2><p>${t('placedS')} ${tbl}.</p><div class="num">${t('orderno')}<b>${o.no}</b></div>${o.payNow?`<div class="num" style="margin-left:6px;color:var(--green);background:var(--green-soft)">${t('paid')} ✓</div>`:''}
  <div class="steps" style="--pg:${(Math.min(o.step,3)-1)/2}">${st}</div>
  <div class="hist">${o.lines.map(l=>`<div class="line simple"><div><div class="lt">${l.q}× ${items[l.id].t[lang]}</div>${l.sub?`<div class="ls">${l.sub}</div>`:''}</div><div class="lp">${eur(l.p*l.q)}</div></div>`).join('')}<div class="tot"><span>${t('total')}</span><span>${eur(o.tot)}</span></div></div></div>`;
}
$('#orderBody').addEventListener('click',e=>{
  const b=e.target.closest('button[data-i]');if(b){const i=+b.dataset.i;cart[i].q+=+b.dataset.d;if(cart[i].q<=0)cart.splice(i,1);persist();syncCart();renderOrder();return}
  const p=e.target.closest('[data-pay]');if(p){payNow=p.dataset.pay==='1';$$('#orderBody [data-pay]').forEach(x=>x.setAttribute('aria-checked',x===p))}
});
$('#orderBody').addEventListener('input',e=>{if(e.target.id==='guest')guest=e.target.value});
$('#placeBtn').onclick=()=>{
  const no=`${tbl}-${String(orders.length+1).padStart(2,'0')}`;
  const o={no,lines:cart.map(l=>({...l})),tot:cart.reduce((a,l)=>a+l.p*l.q,0),step:1,guest,payNow};
  orders.push(o);cart.length=0;persist();
  // demo: simulated kitchen progress
  const adv=(s,ms)=>setTimeout(()=>{o.step=s;syncCart();if(open==='#sOrder'&&!cart.length)renderOrder();if(s===3)toast(`${t('status')} ${no}: ${t('s3')}`)},ms);
  adv(2,5000);adv(3,14000);adv(4,30000);
  syncCart();renderOrder();$('#orderBody').scrollTop=0;
};

// ---------- service ----------
$('#bellBtn').onclick=()=>show('#sSvc');
const svc=(btn,msg,lbl)=>{btn.classList.add('on');btn.disabled=true;$('#svcHist').insertAdjacentHTML('afterbegin',`<div class="line simple" style="margin-top:8px"><div class="lt">${lbl}</div><div class="ls">${new Date().toLocaleTimeString(lang,{hour:'2-digit',minute:'2-digit'})}</div></div>`);hide();toast(msg);setTimeout(()=>{btn.classList.remove('on');btn.disabled=false},60000)};
$('#svcWaiter').onclick=()=>svc($('#svcWaiter'),t('waiterT'),t('waiterH'));
$('#svcBill').onclick=()=>svc($('#svcBill'),t('billT'),t('billH'));

// ---------- search ----------
$('#searchBtn').onclick=()=>{show('#sSearch');$('#q').value='';$('#res').innerHTML='';setTimeout(()=>$('#q').focus(),350)};
$('#q').addEventListener('input',()=>{
  const q=$('#q').value.trim().toLowerCase();const r=$('#res');if(q.length<2){r.innerHTML='';return}
  const hits=Object.values(items).filter(it=>it.t[lang].toLowerCase().includes(q)||it.d[lang].toLowerCase().includes(q)||it.n===q).slice(0,25);
  r.innerHTML=hits.length?hits.map(itemHTML).join(''):`<p class="desc">${t('noresult')}</p>`;syncCart();
});

let tt;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200)}

applyText();render();renderInfo();
</script>
</body>
</html>
